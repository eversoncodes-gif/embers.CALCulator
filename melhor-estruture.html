<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Everson Anselmo Muianga">
    <meta name="description" content="calculadora do tipo normal">
    <meta name="keywords" content="calcular,especificar,jogar.">
    <link rel="stylesheet" href="estilo/desenho.css">
    <title>EmbersCALCulador</title>
</head>
<body>
 <main>
 <section class="calculadora">
     <h1>Calculadora</h1>
     <div class="display"><input type="text" placeholder="0" readonly>  </div>   
         <div class="botoes">
            <div class="numeros">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>0</button>
                <button>.</button>
            </div>
            <div class="operadores">
                <button class="operador">+</button>
                <button class="operador">-</button>
                <button class="operador">*</button>
                <button class="operador">/</button>
               <button class="operador">=</button>

            </div>
            <div class="acoes">
                
                <button id="limpar">C</button>
                <button id="apagar">S</button>
                <button id="percentagem">%</button>

            </div>

          </div> 

    </section>

 </main>
<script src="java-script/ligica.js"></script>
</body>
</html>
